worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # Fix stale upstream after container recreate:
    # 1) Use Docker embedded DNS (127.0.0.11)
    # 2) Put the host in a variable so nginx re-resolves at request time
    #    (static `upstream { server gateway:8080; }` only resolves at config load)
    resolver 127.0.0.11 valid=5s ipv6=off;

    server {
        listen 80;
        server_name _;

        location / {
            set $gateway_upstream gateway:8080;
            proxy_pass http://$gateway_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }
    }
}
